name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Frontend: type-check + build
  # ──────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build

  # ──────────────────────────────────────────────────────────────────────────
  # Backend: go vet + build
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (go vet + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: cd backend && go mod download

      - name: Create embed placeholder
        # go:embed is evaluated at vet and build time; dist/main.js must exist.
        run: mkdir -p backend/dist && touch backend/dist/main.js

      - name: Vet
        run: cd backend && go vet ./...

      - name: Test
        run: cd backend && go test ./...

      - name: Build
        run: cd backend && go build -o /dev/null .

  # ──────────────────────────────────────────────────────────────────────────
  # Helm: lint
  # ──────────────────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: "3.14.0"

      - run: helm lint charts/my-plugin/
